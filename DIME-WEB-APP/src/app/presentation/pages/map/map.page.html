<section class="map-wrapper">
  <header class="map-header">
    <div class="header-content">
      <div class="logo-container">
        <img [src]="logoPath" alt="Logo de la empresa" class="company-logo" />
      </div>
      <div class="user-info">
        <span class="welcome-text">Bienvenido, {{ userName() }}</span>
        <button class="logout-button" (click)="logout()" type="button">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <main class="map-content">
    <div class="map-container">
      <div class="map-placeholder">
        <h2>Vista de Mapa</h2>
        <p>Esta es la vista protegida del mapa.</p>
        <p>Aquí se integrará tu funcionalidad de mapas.</p>
        
        <div class="map-actions">
          <button class="action-button primary" (click)="goToMap()">
            🗺️ Abrir Mapa Interactivo
          </button>
        </div>
        
        <div class="auth-info">
          <h3>✅ Autenticación Exitosa</h3>
          <p>Has iniciado sesión correctamente con Microsoft Azure B2C.</p>
          <p>Tu sesión está activa y puedes acceder a todas las funcionalidades protegidas.</p>
        </div>
      </div>
    </div>
  </main>
</section>
