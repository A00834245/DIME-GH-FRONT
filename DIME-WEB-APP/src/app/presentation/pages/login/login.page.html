<section class="login-wrapper">
  <div class="login-card" role="form" aria-labelledby="login-title">
    <div class="logo-container">
      <img [src]="logoPath" alt="Logo de la empresa" class="company-logo" />
    </div>
    <h1 id="login-title" class="login-title">Bienvenido</h1>
    <p class="login-subtitle">Ingresa con tus credenciales de Arca Continental</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label for="username">Correo</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="usuario@empresa.com"
          [attr.aria-invalid]="form.controls['username'].invalid && (form.controls['username'].touched || form.controls['username'].dirty)"
          required
        />
        <small class="error" *ngIf="form.controls['username'].invalid && form.controls['username'].touched">
          El usuario es requerido
        </small>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        />
        <small class="error" *ngIf="form.controls['password'].invalid && form.controls['password'].touched">
          La contraseña es requerida (mínimo 6 caracteres)
        </small>
      </div>

      <button class="login-button" type="submit" [disabled]="form.invalid || isSubmitting()">
        <span *ngIf="!isSubmitting(); else loading">Iniciar sesión</span>
      </button>
      <ng-template #loading>
        <span>Procesando…</span>
      </ng-template>
    </form>
  </div>
</section>
