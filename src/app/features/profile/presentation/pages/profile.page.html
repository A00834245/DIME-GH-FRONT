<app-header 
  [userName]="userName()" 
  (profile)="handleProfile()">
</app-header>

<div class="profile-container">
  <div class="profile-content">
    <!-- Back Button -->
    <button class="back-button" (click)="goBack()" type="button">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Volver al mapa
    </button>

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-icon-large">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="9" r="3" fill="currentColor"/>
            <path d="M6 19.5C6 16.4624 8.46243 14 11.5 14H12.5C15.5376 14 18 16.4624 18 19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="profile-title">Perfil de Usuario</h1>
      </div>

      <div class="profile-body">
        <div class="info-section">
          <div class="info-item">
            <label class="info-label">Nombre</label>
            <div class="info-value">{{ userName() }}</div>
          </div>

          <div class="info-item">
            <label class="info-label">Correo Electrónico</label>
            <div class="info-value">{{ userEmail() }}</div>
          </div>

          <div class="info-item">
            <label class="info-label">Rol</label>
            <div class="info-value">{{ userRole() }}</div>
          </div>

          <div class="info-item">
            <label class="info-label">Departamento</label>
            <div class="info-value">{{ userDepartment() }}</div>
          </div>
        </div>

        <!-- Actions Section -->
        <div class="actions-section">
          <button class="logout-button" (click)="handleLogout()" type="button">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.5 17.5H4.16667C3.72464 17.5 3.30072 17.3244 2.98816 17.0118C2.67559 16.6993 2.5 16.2754 2.5 15.8333V4.16667C2.5 3.72464 2.67559 3.30072 2.98816 2.98816C3.30072 2.67559 3.72464 2.5 4.16667 2.5H7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13.3333 14.1667L17.5 10L13.3333 5.83334" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17.5 10H7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Logout Confirmation Modal -->
<app-bottom-sheet
  [isOpen]="showLogoutModal()"
  title="Cerrar Sesión"
  message="¿Estás seguro de que deseas cerrar sesión?"
  confirmText="Confirmar"
  cancelText="Cancelar"
  (confirm)="confirmLogout()"
  (cancel)="cancelLogout()"
  (close)="cancelLogout()">
</app-bottom-sheet>
