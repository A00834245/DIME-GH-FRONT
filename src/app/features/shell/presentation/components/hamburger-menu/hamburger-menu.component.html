<div class="hamburger-menu">
  <button
    #menuButton
    type="button"
    class="menu-trigger"
    [class.menu-trigger--open]="isMenuOpen()"
    [attr.aria-expanded]="ariaExpanded()"
    aria-controls="primaryMenuPanel"
    aria-label="Menú principal"
    (click)="toggleMenu()"
  >
    <span class="sr-only">Abrir menú de navegación</span>
    <span class="menu-trigger__bar"></span>
    <span class="menu-trigger__bar"></span>
    <span class="menu-trigger__bar"></span>
  </button>
</div>

<div
  class="menu-overlay"
  *ngIf="isMenuOpen()"
  (click)="closeMenu()"
  aria-hidden="true"
></div>

<nav
  id="primaryMenuPanel"
  role="navigation"
  aria-label="Menú principal"
  class="menu-panel"
  [class.menu-panel--open]="isMenuOpen()"
>
  <div class="menu-panel__header">
    <div>
      <p class="menu-panel__title">Menú principal</p>
      <p class="menu-panel__subtitle">Mantén tu contexto y navega rápidamente</p>
    </div>
    <button type="button" class="panel-close" (click)="closeMenu()" aria-label="Cerrar menú">
      <span aria-hidden="true">×</span>
    </button>
  </div>

  <div class="menu-panel__body">
    <div class="menu-error" *ngIf="menuError() as error" role="alert" aria-live="assertive">
      <div class="menu-error__content">
        <strong>Algo no salió bien</strong>
        <p>{{ error }}</p>
      </div>
      <button type="button" class="menu-error__dismiss" (click)="dismissError()">
        Entendido
      </button>
    </div>

    <ul class="menu-options" role="list">
      <li
        class="menu-option-wrapper"
        *ngFor="let option of menuOptions()"
        [class.menu-option-wrapper--active]="option.isActive"
      >
        <button
          type="button"
          class="menu-option"
          (click)="handleOptionSelected(option.id)"
          [attr.aria-current]="option.isActive ? 'page' : null"
          [attr.aria-label]="option.ariaLabel || option.label"
        >
          <span class="menu-option__icon" aria-hidden="true">
            <ng-container [ngSwitch]="option.icon">
              <svg
                *ngSwitchCase="'map'"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M9 4L15 2L21 4V20L15 18L9 20L3 18V2L9 4Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle cx="12" cy="11" r="2" fill="currentColor" />
                <path
                  d="M12 13C13 15 15 17 15 17"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path
                  d="M12 13C11 15 9 17 9 17"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>

              <svg
                *ngSwitchCase="'profile'"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6" />
                <path
                  d="M5 20C5 16.6863 7.68629 14 11 14H13C16.3137 14 19 16.6863 19 20"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>

              <svg
                *ngSwitchCase="'logout'"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15 17L20 12L15 7"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M20 12H8"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
                <path
                  d="M12 20H6C4.34315 20 3 18.6569 3 17V7C3 5.34315 4.34315 4 6 4H12"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </ng-container>
          </span>

          <span class="menu-option__content">
            <span class="menu-option__title">{{ option.label }}</span>
            <span class="menu-option__description">{{ option.description }}</span>
          </span>

          <span class="menu-option__chevron" aria-hidden="true">›</span>
        </button>
      </li>
    </ul>
  </div>
</nav>
